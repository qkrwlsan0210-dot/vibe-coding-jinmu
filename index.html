<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수면 리듬 회복</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1d2233; --muted: #6b7185;
    --accent: #4a5cd6; --err: #d64545; --border: #e2e5ef;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  input { font-size: 1.05rem; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text); width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.bad { border-color: var(--err); }
  .inline { display: flex; align-items: center; gap: 8px; }
  .inline input { width: 90px; }
  .err { color: var(--err); font-size: .85rem; margin-top: 4px; }
  .btn { display: block; width: 100%; margin-top: 4px; padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
  .link { background: none; border: none; color: var(--accent); font-size: .95rem; cursor: pointer; padding: 8px 0; }
  .hidden { display: none !important; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .time { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 12px; text-align: center; }
  .time .l { color: var(--muted); font-size: .9rem; font-weight: 600; }
  .time .v { font-size: 2.2rem; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .time.wake .v { color: var(--accent); }
  .progress { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-align: center; font-size: 1rem; }
  .progress b { font-size: 1.2rem; }
  .check { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .check label { margin-bottom: 8px; }
  .check .row { display: flex; gap: 8px; }
  .check .row input { flex: 1; }
  .check .row .btn { width: auto; margin: 0; padding: 10px 16px; white-space: nowrap; }
  .sched { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
  .sched h2 { font-size: 1rem; margin: 0 0 8px; }
  .sched ol { list-style: none; margin: 0; padding: 0; }
  .sched li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 9px 0; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .sched li:first-child { border-top: none; }
  .sched .d { font-weight: 600; }
  .sched .t { color: var(--muted); font-size: .85rem; }
  .sched .t b { color: var(--text); font-size: 1rem; font-weight: 600; margin-left: 4px; }
</style>
</head>
<body>
<main>

  <!-- 화면 1: 오늘 (기능 2에서 구현) -->
  <section id="today" class="hidden">
    <h1>오늘</h1>
    <p class="sub">이 시각에 맞춰 자고 일어나세요.</p>
    <div class="times">
      <div class="time"><div class="l">다음 취침</div><div class="v" id="nextBed">--:--</div></div>
      <div class="time wake"><div class="l">다음 기상</div><div class="v" id="nextWake">--:--</div></div>
    </div>
    <div class="progress" id="progress"></div>
    <form class="check" id="checkForm">
      <label for="actualWake">실제 기상 시각</label>
      <div class="row">
        <input type="time" id="actualWake">
        <button type="submit" class="btn">일어났어요</button>
      </div>
      <div class="err" id="actualErr"></div>
    </form>
    <div class="sched" id="sched">
      <h2>목표일까지 일정</h2>
      <ol id="schedList"></ol>
    </div>
    <button class="link" id="editPlan">플랜 수정</button>
  </section>

  <!-- 화면 2: 플랜 설정 -->
  <section id="setup" class="hidden">
    <h1>회복 플랜 설정</h1>
    <p class="sub">지금 일어나는 시각에서 목표 시각까지 하루씩 조금씩 옮겨 갑니다.</p>
    <form class="card" id="planForm" novalidate>
      <div class="field">
        <label for="curWake">현재 평소 기상 시각</label>
        <input type="time" id="curWake">
        <div class="err" id="curWakeErr"></div>
      </div>
      <div class="field">
        <label for="goalWake">목표 기상 시각</label>
        <input type="time" id="goalWake">
        <div class="err" id="goalWakeErr"></div>
      </div>
      <div class="field">
        <label for="step">하루 이동 폭</label>
        <div class="inline"><input type="number" id="step" inputmode="numeric" min="1" max="180" step="1"><span>분</span></div>
        <div class="hint">1~180분</div>
        <div class="err" id="stepErr"></div>
      </div>
      <div class="field">
        <label for="sleepH">수면 시간</label>
        <div class="inline">
          <input type="number" id="sleepH" inputmode="numeric" min="3" max="14" step="1"><span>시간</span>
          <input type="number" id="sleepM" inputmode="numeric" min="0" max="59" step="1"><span>분</span>
        </div>
        <div class="hint">3~14시간</div>
        <div class="err" id="sleepErr"></div>
      </div>
      <div class="field">
        <label for="startDate">시작 날짜</label>
        <input type="date" id="startDate">
        <div class="hint">일정 첫날의 취침 날짜</div>
        <div class="err" id="startDateErr"></div>
      </div>
      <button type="submit" class="btn">플랜 저장</button>
    </form>
    <button class="link hidden" id="cancelEdit">취소</button>
  </section>

</main>
<script>
const PLAN_KEY = 'sleepPlan';
const DEFAULTS = { curWake: '13:00', goalWake: '08:00', step: 30, sleepMin: 480 };
const $ = id => document.getElementById(id);

// ---- 시각 계산 (분 단위, 0~1439) ----
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const wrap = m => ((m % 1440) + 1440) % 1440;
const fmt = m => { m = wrap(m); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

// 기준 기상 시각(from)에서 목표(goal)까지 짧은 쪽 방향의 차이(분). 정확히 12시간이면 앞당기는 쪽(음수) [가정]
function shortestDiff(from, goal) {
  let d = wrap(goal - from);
  if (d > 720) d -= 1440;
  if (d === 720) d = -720;
  return d;
}

// 기준 기상 시각에서 1단계 이동한 다음 일정
function nextSchedule(baseWake, plan) {
  const goal = toMin(plan.goalWake);
  const d = shortestDiff(baseWake, goal);
  if (d === 0) return { reached: true, wake: goal, bed: wrap(goal - plan.sleepMin), daysLeft: 0 };
  const move = Math.sign(d) * Math.min(plan.step, Math.abs(d));
  const wake = wrap(baseWake + move);
  return { reached: false, wake, bed: wrap(wake - plan.sleepMin), daysLeft: Math.ceil(Math.abs(d) / plan.step) };
}

// ---- 날짜 (로컬 기준, 일 번호로 계산) ----
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const dayNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDay = n => { const d = new Date(n * 864e5); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]})`; };

function loadLast() {
  const raw = localStorage.getItem(LAST_KEY);
  if (!raw) return null;
  try { const o = JSON.parse(raw); if (o && o.time) return o; } catch {}
  return /^\d{2}:\d{2}$/.test(raw) ? { time: raw, date: todayISO() } : null;  // 이전 형식(시각만) 호환
}

// 목표 도달까지의 일정. 각 줄 = 취침 날짜, 취침, 기상. 시각은 절대 분(일 번호*1440 + 분)으로 계산해 자정 넘김 처리
function buildSchedule(plan, last) {
  const goal = toMin(plan.goalWake);
  let wake = toMin(last ? last.time : plan.curWake);
  let wakeAbs;  // 직전 기상의 절대 분
  if (last) wakeAbs = dayNum(last.date) * 1440 + wake;
  const rows = [];
  let firstBedAbs = null;
  for (let i = 0; i < 2000; i++) {
    const d = shortestDiff(wake, goal);
    if (d === 0) break;
    const move = Math.sign(d) * Math.min(plan.step, Math.abs(d));
    const nextWake = wrap(wake + move);
    let bedAbs, nextWakeAbs;
    if (i === 0 && !last) {
      // 기록이 없으면: 첫 줄 취침 날짜 = 시작 날짜
      bedAbs = dayNum(plan.startDate) * 1440 + wrap(nextWake - plan.sleepMin);
      nextWakeAbs = bedAbs + plan.sleepMin;
    } else {
      nextWakeAbs = wakeAbs + 1440 + move;
      bedAbs = nextWakeAbs - plan.sleepMin;
    }
    rows.push({ day: Math.floor(bedAbs / 1440), bed: wrap(bedAbs), wake: nextWake });
    wake = nextWake; wakeAbs = nextWakeAbs;
  }
  return rows;
}

function renderToday() {
  const plan = loadPlan();
  if (!plan) return;
  if (!plan.startDate) plan.startDate = todayISO();  // 시작 날짜가 없던 이전 플랜
  const last = loadLast();
  // 규칙: 다음 목표 = 마지막 실제 기상 시각 + 1단계 (기록이 없으면 플랜의 현재 기상 시각)
  const s = nextSchedule(toMin(last ? last.time : plan.curWake), plan);
  const rows = buildSchedule(plan, last);
  $('sched').classList.toggle('hidden', rows.length === 0);
  $('schedList').innerHTML = rows.map(r =>
    `<li><span class="d">${fmtDay(r.day)}</span><span class="t">취침<b>${fmt(r.bed)}</b></span><span class="t">기상<b>${fmt(r.wake)}</b></span></li>`).join('');
  $('nextBed').textContent = fmt(s.bed);
  $('nextWake').textContent = fmt(s.wake);
  $('progress').innerHTML = s.reached
    ? '🎉 <b>목표 도달</b> · 유지 단계<br><small>매일 이 시각에 맞춰 자고 일어나세요</small>'
    : s.daysLeft === 1 ? '다음 기상이면 <b>목표 도달</b>' : `목표까지 <b>${s.daysLeft}일</b>`;
}

const LAST_KEY = 'lastActualWake';
const nowHHMM = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

function loadPlan() {
  try { return JSON.parse(localStorage.getItem(PLAN_KEY)); } catch { return null; }
}

function showScreen(id) {
  ['today', 'setup'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  if (id === 'today') { renderToday(); $('actualWake').value = nowHHMM(); $('actualErr').textContent = ''; }
  window.scrollTo(0, 0);
}

function fillForm(p) {
  $('curWake').value = p.curWake;
  $('goalWake').value = p.goalWake;
  $('step').value = p.step;
  $('sleepH').value = Math.floor(p.sleepMin / 60);
  $('sleepM').value = p.sleepMin % 60;
  $('startDate').value = p.startDate || todayISO();
  clearErrors();
}

function clearErrors() {
  document.querySelectorAll('.err').forEach(e => e.textContent = '');
  document.querySelectorAll('input.bad').forEach(i => i.classList.remove('bad'));
}

function setErr(inputIds, errId, msg) {
  inputIds.forEach(i => $(i).classList.add('bad'));
  $(errId).textContent = msg;
}

// 입력 검증: 문제가 없으면 플랜 객체, 있으면 null
function readForm() {
  clearErrors();
  let ok = true;
  const curWake = $('curWake').value, goalWake = $('goalWake').value;
  if (!curWake) { setErr(['curWake'], 'curWakeErr', '현재 기상 시각을 입력해주세요.'); ok = false; }
  if (!goalWake) { setErr(['goalWake'], 'goalWakeErr', '목표 기상 시각을 입력해주세요.'); ok = false; }

  const stepRaw = $('step').value.trim();
  const step = Number(stepRaw);
  if (stepRaw === '' || !Number.isInteger(step) || step < 1 || step > 180) {
    setErr(['step'], 'stepErr', '하루 이동 폭은 1~180 사이의 정수(분)로 입력해주세요.'); ok = false;
  }

  const hRaw = $('sleepH').value.trim(), mRaw = $('sleepM').value.trim();
  const h = Number(hRaw), m = mRaw === '' ? 0 : Number(mRaw);
  if (hRaw === '' || !Number.isInteger(h) || !Number.isInteger(m) || m < 0 || m > 59) {
    setErr(['sleepH', 'sleepM'], 'sleepErr', '수면 시간은 시간(정수)과 분(0~59)으로 입력해주세요.'); ok = false;
  } else if (h * 60 + m < 180 || h * 60 + m > 840) {
    setErr(['sleepH', 'sleepM'], 'sleepErr', '수면 시간은 3~14시간 사이로 입력해주세요.'); ok = false;
  }

  const startDate = $('startDate').value;
  if (!startDate) { setErr(['startDate'], 'startDateErr', '시작 날짜를 입력해주세요.'); ok = false; }

  if (!ok) return null;
  return { curWake, goalWake, step, sleepMin: h * 60 + m, startDate, createdAt: new Date().toISOString() };
}

$('planForm').onsubmit = e => {
  e.preventDefault();
  const plan = readForm();
  if (!plan) { const bad = document.querySelector('input.bad'); if (bad) bad.focus(); return; }
  localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
  localStorage.removeItem(LAST_KEY);  // 새 플랜은 입력한 '현재 기상 시각'부터 시작 [가정]
  showScreen('today');
};

$('checkForm').onsubmit = e => {
  e.preventDefault();
  const t = $('actualWake').value;
  if (!t) { $('actualErr').textContent = '기상 시각을 입력해주세요.'; return; }
  localStorage.setItem(LAST_KEY, JSON.stringify({ time: t, date: todayISO() }));
  showScreen('today');
};

$('editPlan').onclick = () => {
  fillForm(loadPlan() || DEFAULTS);
  $('cancelEdit').classList.remove('hidden');
  showScreen('setup');
};
$('cancelEdit').onclick = () => showScreen('today');

// 시작: 플랜이 없으면 설정 화면부터
const saved = loadPlan();
if (saved) showScreen('today');
else { fillForm(DEFAULTS); showScreen('setup'); }
</script>
</body>
</html>
