<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수면 리듬 회복</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1d2233; --muted: #6b7185;
    --accent: #4a5cd6; --err: #d64545; --border: #e2e5ef;
    --sun: #e8963c; --ring: #e9ecf5;
    --bar: #26305a; --good: #2f7a5a; --soft: #eef0f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .group { margin-bottom: 20px; }
  .group h2 { font-size: 1rem; margin: 0 0 10px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { margin-bottom: 18px; }
  .pair .field { margin-bottom: 0; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; color: var(--muted); }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 4px; }
  input { font-size: 1.05rem; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text); width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.bad { border-color: var(--err); }
  .inline { display: flex; align-items: center; gap: 8px; }
  .inline input { width: 90px; }
  .err { color: var(--err); font-size: .85rem; margin-top: 4px; }
  .btn { display: block; width: 100%; margin-top: 4px; padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
  .link { background: none; border: none; color: var(--accent); font-size: .95rem; cursor: pointer; padding: 8px 0; }
  .hidden { display: none !important; }
  .sched { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 6px 16px; }
  .sched ol { list-style: none; margin: 0; padding: 0; }
  .sched li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 11px 0; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .sched li:first-child { border-top: none; }
  .sched .d { font-weight: 600; }
  .sched .t { color: var(--muted); font-size: .85rem; }
  .sched .t b { color: var(--text); font-size: 1rem; font-weight: 600; margin-left: 4px; }
  .dial { display: block; width: 100%; max-width: 280px; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dial .track { fill: none; stroke: var(--ring); stroke-width: 22; }
  .dial .arc { fill: none; stroke: var(--accent); stroke-opacity: .35; stroke-width: 22; }
  .dial .tick { stroke: var(--muted); stroke-width: 1.5; }
  .dial .tick.major { stroke-width: 2.5; }
  .dial .hour { fill: var(--muted); font-size: 12px; text-anchor: middle; dominant-baseline: central; }
  .dial .handle { cursor: grab; stroke: var(--card); stroke-width: 3; }
  .dial .handle:focus { outline: none; stroke: var(--text); }
  .dial .handle.bed { fill: var(--accent); }
  .dial .handle.wake { fill: var(--sun); }
  .dial .icon { font-size: 13px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .dial .cl { fill: var(--muted); font-size: 12px; text-anchor: middle; }
  .dial .cv { fill: var(--text); font-size: 24px; font-weight: 700; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .dial .cd { fill: var(--muted); font-size: 12px; text-anchor: middle; }
  .sched .t small { color: var(--muted); font-size: .75rem; margin-left: 2px; }
  .finish { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); font-size: .95rem; }
  .finish b { font-size: 1.05rem; }
  .pats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px 24px; }
  .dirs { margin-top: 18px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px 14px; padding-top: 10px; }
  .opt { position: relative; display: block; background: var(--soft); border: 2px solid var(--border); border-radius: 14px; padding: 18px; cursor: pointer; color: var(--text); font-weight: 400; margin: 0; min-width: 0; }
  .opt:has(input:checked) { background: var(--card); border-color: var(--bar); }
  .opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .badge { position: absolute; top: -10px; right: 14px; background: var(--sun); color: var(--card); font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .opt .name { font-weight: 700; font-size: 1.1rem; }
  .opt .desc { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .opt .mini { display: block; width: 84px; height: 84px; margin: 12px auto 4px; }
  .mini .base { fill: none; stroke: var(--ring); stroke-width: 7; }
  .mini .path { fill: none; stroke: var(--bar); stroke-width: 7; stroke-linecap: round; }
  .mini .lbl { fill: var(--muted); font-size: 7px; text-anchor: middle; }
  .opt .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-top: 8px; }
  .opt .stats b { display: block; font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .opt .stats span { color: var(--muted); font-size: .75rem; }
  .prev { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .prev li { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; font-size: .78rem; font-variant-numeric: tabular-nums; }
  .prev li.gap { display: block; text-align: center; color: var(--muted); line-height: .6; }
  .prev .lb { font-weight: 600; }
  .prev .trk { position: relative; height: 14px; background: var(--ring); border-radius: 4px; overflow: hidden; }
  .prev .seg { position: absolute; top: 2px; bottom: 2px; background: var(--bar); border-radius: 3px; }
  .prev li.goal .seg { background: var(--sun); }
  .prev .tm { white-space: nowrap; }
  .prev .dl { color: var(--good); margin-left: 2px; }
  .prev .dl.fast { color: var(--err); }
  .pc { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 3px; font-size: .82rem; }
  .pc li::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--good); }
  .pc li.bad::before { background: var(--sun); }
  .why { font-size: .9rem; color: var(--muted); margin: 14px 0 0; line-height: 1.6; }
  .why b { color: var(--text); }
  .period { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  .period .big { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 12px; }
  .period .big b { display: block; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .period .big span { color: var(--muted); font-size: .8rem; }
  .period .big .ok { color: var(--good); }
  .period .big .fast { color: var(--err); }
  .period .row { display: flex; align-items: center; gap: 12px; }
  .period .row label { margin: 0; }
  .period input[type=range] { flex: 1; padding: 0; border: none; background: none; accent-color: var(--bar); }
  .period .finish { margin-top: 10px; }
  .dial-hint { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 4px; }
  .done { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; }
</style>
</head>
<body>
<main>

  <!-- 화면 1: 일정 -->
  <section id="today" class="hidden">
    <h1 id="schedTitle">일정</h1>
    <p class="sub" id="schedSub"></p>
    <div class="sched" id="sched"><ol id="schedList"></ol></div>
    <div class="done hidden" id="sameMsg">현재 패턴이 이미 목표 패턴과 같습니다.</div>
    <button class="link" id="editPlan">플랜 수정</button>
  </section>

  <!-- 화면 2: 플랜 설정 -->
  <section id="setup" class="hidden">
    <h1>회복 플랜 설정</h1>
    <p class="sub">현재 패턴에서 목표 패턴까지 하루씩 조금씩 옮기는 일정을 만듭니다.</p>
    <form class="card" id="planForm" novalidate>
      <div class="pats">
      <div class="group">
        <h2>현재 패턴</h2>
        <input type="hidden" id="curBed"><input type="hidden" id="curWake">
        <svg class="dial" id="curDial" viewBox="0 0 280 280" role="group" aria-label="현재 패턴 시계"></svg>
        <div class="err" id="curErr"></div>
      </div>
      <div class="group">
        <h2>목표 패턴</h2>
        <input type="hidden" id="goalBed"><input type="hidden" id="goalWake">
        <svg class="dial" id="goalDial" viewBox="0 0 280 280" role="group" aria-label="목표 패턴 시계"></svg>
        <div class="err" id="goalErr"></div>
      </div>
      </div>
      <p class="dial-hint">🌙 취침과 ☀️ 기상 손잡이를 원을 따라 끌어서 맞추세요 (10분 단위)</p>
      <div class="field" style="margin-top:18px">
        <label for="startDate">적용 날짜</label>
        <input type="date" id="startDate">
        <div class="err" id="startDateErr"></div>
      </div>
      <div class="dirs" id="dirs">
        <div class="opts">
          <label class="opt"><input type="radio" name="dir" id="dirAdvance" value="advance">
            <span class="badge hidden" id="advBadge">추천</span>
            <div class="name">앞으로 당기기</div>
            <div class="desc">매일 조금 일찍 자고 일어나며 거슬러 올라갑니다</div>
            <svg class="mini" id="advRing" viewBox="0 0 100 100" aria-hidden="true"></svg>
            <div class="stats" id="advStats"></div>
            <ol class="prev" id="advPrev"></ol>
            <ul class="pc"><li>출근·등교하며 할 수 있음</li><li>도착하면 안정적으로 머묾</li><li class="bad">느리고 처음 1~2주 피곤함</li></ul>
          </label>
          <label class="opt"><input type="radio" name="dir" id="dirDelay" value="delay">
            <span class="badge hidden" id="delBadge">추천</span>
            <div class="name">뒤로 미루기</div>
            <div class="desc">매일 더 늦게 자며 시계를 한 바퀴 돕니다</div>
            <svg class="mini" id="delRing" viewBox="0 0 100 100" aria-hidden="true"></svg>
            <div class="stats" id="delStats"></div>
            <ol class="prev" id="delPrev"></ol>
            <ul class="pc"><li>몸의 자연 방향이라 쉽고 빠름</li><li>잠이 안 와서 뒤척일 일이 적음</li><li class="bad">며칠은 낮에 자야 해서 생활 유지 어려움</li></ul>
          </label>
        </div>
        <p class="why" id="why"></p>
      </div>
      <div class="period">
        <div class="big">
          <div><b id="pDays">-</b><span>걸리는 기간</span></div>
          <div><b id="pPer">-</b><span>하루에 옮기는 양</span></div>
          <div><b id="pRate">-</b><span id="pRateL">속도</span></div>
        </div>
        <div class="row"><label for="days">기간</label><input type="range" id="days" min="1" max="60" step="1"></div>
        <div class="err" id="daysErr"></div>
        <p class="finish" id="finish"></p>
      </div>
      <button type="submit" class="btn">일정 만들기</button>
    </form>
    <button class="link hidden" id="cancelEdit">취소</button>
  </section>

</main>
<script>
const PLAN_KEY = 'sleepPlanV3';
const $ = id => document.getElementById(id);

// ---- 시각 (분 단위, 0~1439) ----
const pad2 = n => String(n).padStart(2, '0');
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const wrap = m => ((m % 1440) + 1440) % 1440;
const fmt = m => { m = wrap(m); return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); };

// from에서 goal까지 짧은 쪽 방향의 차이(분). 정확히 12시간이면 앞당기는 쪽(음수) [가정]
function shortestDiff(from, goal) {
  let d = wrap(goal - from);
  if (d > 720) d -= 1440;
  if (d === 720) d = -720;
  return d;
}


// ---- 날짜 (로컬 기준, 일 번호로 계산) ----
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const dayNum = iso => { const [y, m, d] = iso.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const fmtDay = n => { const d = new Date(n * 864e5); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${DOW[d.getUTCDay()]})`; };

const DEFAULTS = { curBed: '06:00', curWake: '15:00', goalBed: '23:00', goalWake: '09:00' };

// 현재 패턴 → 목표 패턴 일정. 적용 기간(N일) 동안 취침·기상을 각각 (차이 ÷ N)씩 옮겨 N번째 날에 목표 도달.
// k번째 줄(1~N) 날짜 = 적용 날짜 + (k-1) = 그날의 기상 날짜. 취침 > 기상(분)이면 취침은 전날 밤.
const r5 = m => Math.round(m / 5) * 5;
// 방향별 이동량(분): 앞당기기는 0 또는 음수, 미루기는 0 또는 양수
function dirDiff(from, goal, dir) { const d = wrap(goal - from); return d === 0 ? 0 : dir === 'delay' ? d : d - 1440; }
function moves(plan, dir) { return { bed: dirDiff(toMin(plan.curBed), toMin(plan.goalBed), dir), wake: dirDiff(toMin(plan.curWake), toMin(plan.goalWake), dir) }; }
// 기본 방향: 취침·기상 이동 거리 합이 더 짧은 쪽
function shorterDir(plan) { const a = moves(plan, 'advance'), d = moves(plan, 'delay'); return Math.abs(a.bed) + Math.abs(a.wake) <= Math.abs(d.bed) + Math.abs(d.wake) ? 'advance' : 'delay'; }
const isDaySleep = bed => bed >= 8 * 60 && bed < 18 * 60;  // 08:00~17:59 취침 = 낮에 자는 날 [가정]
function buildSchedule(plan) {
  const cBed = toMin(plan.curBed), cWake = toMin(plan.curWake);
  const mv = moves(plan, plan.dir || shorterDir(plan)), dBed = mv.bed, dWake = mv.wake;
  if (dBed === 0 && dWake === 0) return [];
  const n = plan.days, start = dayNum(plan.startDate), rows = [];
  // 기상 시각을 절대 분으로 이어 붙임: 하루마다 24시간 + 그날 이동량. 첫 기상 날짜 = 적용 날짜.
  // (하루 이동이 크면 기상 날짜가 하루를 건너뛰거나 겹칠 수 있음)
  const off = k => ({ bed: r5(dBed * k / n), wake: r5(dWake * k / n) });  // 5분 단위 (진무 요청)
  const base = start * 1440 + wrap(cWake + off(1).wake) - off(1).wake;
  for (let k = 1; k <= n; k++) {
    const o = off(k), bed = wrap(cBed + o.bed), wake = wrap(cWake + o.wake);
    const wakeAbs = base + (k - 1) * 1440 + o.wake, bedAbs = wakeAbs - wrap(wake - bed);
    const day = Math.floor(wakeAbs / 1440);
    rows.push({ day, bed, wake, prevNight: Math.floor(bedAbs / 1440) < day });
  }
  return rows;
}
// 완료일 = 마지막 기상 날짜
const finishDay = plan => { const r = buildSchedule(plan); return r.length ? r.at(-1).day : dayNum(plan.startDate); };

// ---- 24시간 원형 다이얼: 0시가 위, 시계 방향. 취침·기상 손잡이를 끌어 시각 입력 ----
const SNAP = 10;  // 분 단위 [가정]
const SVGNS = 'http://www.w3.org/2000/svg';
const CX = 140, CY = 140, R = 100;
const pt = (min, r) => { const a = min / 1440 * 2 * Math.PI; return [CX + r * Math.sin(a), CY - r * Math.cos(a)]; };
function el(tag, attrs, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
const durText = m => `수면 ${Math.floor(m / 60)}시간${m % 60 ? ' ' + (m % 60) + '분' : ''}`;

function makeDial(prefix) {
  const svg = $(prefix + 'Dial'), inBed = $(prefix + 'Bed'), inWake = $(prefix + 'Wake');
  el('circle', { class: 'track', cx: CX, cy: CY, r: R }, svg);
  const arc = el('path', { class: 'arc' }, svg);
  for (let h = 0; h < 24; h++) {
    const major = h % 6 === 0, [x1, y1] = pt(h * 60, R - 18), [x2, y2] = pt(h * 60, R - (major ? 28 : 23));
    el('line', { class: 'tick' + (major ? ' major' : ''), x1, y1, x2, y2 }, svg);
    if (major) { const [x, y] = pt(h * 60, R + 26); el('text', { class: 'hour', x, y }, svg).textContent = h + '시'; }
  }
  const cBedL = el('text', { class: 'cl', x: CX - 40, y: CY - 18 }, svg); cBedL.textContent = '🌙 취침';
  const cBed = el('text', { class: 'cv', x: CX - 40, y: CY + 10 }, svg);
  const cWakeL = el('text', { class: 'cl', x: CX + 40, y: CY - 18 }, svg); cWakeL.textContent = '☀️ 기상';
  const cWake = el('text', { class: 'cv', x: CX + 40, y: CY + 10 }, svg);
  const cDur = el('text', { class: 'cd', x: CX, y: CY + 36 }, svg);
  const handles = {};
  for (const [k, icon, label] of [['bed', '🌙', '취침'], ['wake', '☀️', '기상']]) {
    const g = el('g', {}, svg);
    const c = el('circle', { class: 'handle ' + k, r: 16, tabindex: 0, role: 'slider', 'aria-label': label + ' 시각' }, g);
    const t = el('text', { class: 'icon' }, g); t.textContent = icon;
    handles[k] = { c, t };
  }
  const input = { bed: inBed, wake: inWake };
  function draw() {
    const b = toMin(inBed.value || '00:00'), w = toMin(inWake.value || '00:00');
    const [bx, by] = pt(b, R), [wx, wy] = pt(w, R), d = wrap(w - b);
    arc.setAttribute('d', d ? `M ${bx} ${by} A ${R} ${R} 0 ${d > 720 ? 1 : 0} 1 ${wx} ${wy}` : '');
    for (const [k, m] of [['bed', b], ['wake', w]]) {
      const [x, y] = pt(m, R);
      handles[k].c.setAttribute('cx', x); handles[k].c.setAttribute('cy', y);
      handles[k].t.setAttribute('x', x); handles[k].t.setAttribute('y', y);
      handles[k].c.setAttribute('aria-valuetext', fmt(m));
    }
    cBed.textContent = fmt(b); cWake.textContent = fmt(w); cDur.textContent = d ? durText(d) : '';
  }
  function setVal(k, m) { input[k].value = fmt(Math.round(wrap(m) / SNAP) * SNAP); draw(); if (typeof updateFinish === 'function') updateFinish(); }
  let active = null;
  const toMinutes = e => {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 280 - CX, y = (e.clientY - r.top) / r.height * 280 - CY;
    return wrap(Math.atan2(x, -y) / (2 * Math.PI) * 1440);
  };
  for (const k of ['bed', 'wake']) {
    handles[k].c.addEventListener('pointerdown', e => { active = k; svg.setPointerCapture(e.pointerId); handles[k].c.focus(); e.preventDefault(); });
    handles[k].c.addEventListener('keydown', e => {
      const d = { ArrowRight: SNAP, ArrowUp: SNAP, ArrowLeft: -SNAP, ArrowDown: -SNAP }[e.key];
      if (d) { setVal(k, toMin(input[k].value) + d); e.preventDefault(); }
    });
  }
  svg.addEventListener('pointermove', e => { if (active) setVal(active, toMinutes(e)); });
  const end = () => { active = null; };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  return { draw };
}
const dials = { cur: makeDial('cur'), goal: makeDial('goal') };

function loadPlan() {
  try { return JSON.parse(localStorage.getItem(PLAN_KEY)); } catch { return null; }
}

function renderSchedule() {
  const plan = loadPlan();
  if (!plan) return;
  const rows = buildSchedule(plan);
  $('sched').classList.toggle('hidden', rows.length === 0);
  $('sameMsg').classList.toggle('hidden', rows.length !== 0);
  $('schedTitle').textContent = rows.length ? `${fmtDay(dayNum(plan.startDate))} ~ ${fmtDay(finishDay(plan))} 완료` : '일정';
  if (rows.length) $('schedTitle').textContent += ` (${plan.days}일 계획 · ${(plan.dir || shorterDir(plan)) === 'delay' ? '미루기' : '앞당기기'})`;
  $('schedSub').textContent = `${plan.curBed} 취침 · ${plan.curWake} 기상 → ${plan.goalBed} 취침 · ${plan.goalWake} 기상`;
  $('schedList').innerHTML = rows.map(r =>
    `<li><span class="d">${fmtDay(r.day)}</span><span class="t">취침<b>${fmt(r.bed)}</b>${r.prevNight ? '<small>전날</small>' : ''}</span><span class="t">기상<b>${fmt(r.wake)}</b></span></li>`).join('');
}

function showScreen(id) {
  ['today', 'setup'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  if (id === 'today') renderSchedule();
  window.scrollTo(0, 0);
}

function fillForm(p) {
  ['curBed', 'curWake', 'goalBed', 'goalWake'].forEach(k => $(k).value = p[k]);
  $('startDate').value = p.startDate || todayISO();
  const dir = p.dir || recommend({ ...p, startDate: $('startDate').value });
  $('dirAdvance').checked = dir === 'advance'; $('dirDelay').checked = dir === 'delay';
  const n = p.days || recDays(p, dir);
  $('days').max = Math.max(60, n); $('days').value = n;
  updateFinish();
  dials.cur.draw(); dials.goal.draw();
  clearErrors();
}

function clearErrors() {
  document.querySelectorAll('.err').forEach(e => e.textContent = '');
  document.querySelectorAll('input.bad').forEach(i => i.classList.remove('bad'));
}

function setErr(inputIds, errId, msg) {
  inputIds.forEach(i => $(i).classList.add('bad'));
  $(errId).textContent = msg;
}

// 입력 검증: 문제가 없으면 플랜 객체, 있으면 null
function readForm() {
  clearErrors();
  let ok = true;
  const v = id => $(id).value;
  for (const [b, w, err, name] of [['curBed', 'curWake', 'curErr', '현재'], ['goalBed', 'goalWake', 'goalErr', '목표']]) {
    if (!v(b) || !v(w)) { setErr([b, w].filter(i => !v(i)), err, `${name} 패턴의 취침·기상 시각을 모두 입력해주세요.`); ok = false; }
    else if (v(b) === v(w)) { setErr([b, w], err, `${name} 패턴의 취침과 기상 시각이 같습니다.`); ok = false; }
  }
  const daysRaw = v('days').trim(), days = Number(daysRaw);
  if (daysRaw === '' || !Number.isInteger(days) || days < 1 || days > Number($('days').max)) {
    setErr(['days'], 'daysErr', `기간은 1~${$('days').max}일 사이로 정해주세요.`); ok = false;
  }
  if (!v('startDate')) { setErr(['startDate'], 'startDateErr', '적용 날짜를 입력해주세요.'); ok = false; }
  if (!ok) return null;
  return { curBed: v('curBed'), curWake: v('curWake'), goalBed: v('goalBed'), goalWake: v('goalWake'), days, startDate: v('startDate'), dir: $('dirDelay').checked ? 'delay' : 'advance' };
}

// ---- 방향 비교 ----
const PACE = { advance: 30, delay: 90 };  // 하루 권장 이동(분) — 진무가 보여준 화면 기준 [가정]
const recDays = (p, dir) => { const m = moves(p, dir); return Math.max(1, Math.ceil(Math.max(Math.abs(m.bed), Math.abs(m.wake)) / PACE[dir])); };
const daySleeps = rows => rows.filter(r => isDaySleep(r.bed)).length;
const hShort = m => { const h = Math.abs(m) / 60; return (Number.isInteger(h) ? h : h.toFixed(1)) + 'h'; };
const hm = m => { m = Math.abs(m); return `${Math.floor(m / 60)}시간${m % 60 ? ' ' + m % 60 + '분' : ''}`; };
function recommend(p) {
  const s = ['advance', 'delay'].map(dir => { const n = recDays(p, dir); return { dir, n, ds: daySleeps(buildSchedule({ ...p, dir, days: n })) }; });
  s.sort((a, b) => a.ds - b.ds || a.n - b.n);
  return s[0].dir;
}
const curForm = () => ({ curBed: $('curBed').value, curWake: $('curWake').value, goalBed: $('goalBed').value, goalWake: $('goalWake').value,
  startDate: $('startDate').value || todayISO(), days: Number($('days').value), dir: $('dirDelay').checked ? 'delay' : 'advance' });

// 미니 원: 현재 취침(진한 점) → 목표 취침(주황 점), 이동하는 길을 굵게
function drawRing(svg, p, dir) {
  const r = 34, c = 50, P = m => { const a = m / 1440 * 2 * Math.PI; return [c + r * Math.sin(a), c - r * Math.cos(a)]; };
  const from = toMin(p.curBed), mv = moves(p, dir).bed, to = wrap(from + mv);
  const [s0, s1] = mv >= 0 ? [from, to] : [to, from], span = Math.abs(mv);
  const [x0, y0] = P(s0), [x1, y1] = P(s1), [cx, cy] = P(from), [gx, gy] = P(to);
  svg.innerHTML = `<circle class="base" cx="50" cy="50" r="${r}"/>` +
    (span ? `<path class="path" d="M ${x0} ${y0} A ${r} ${r} 0 ${span > 720 ? 1 : 0} 1 ${x1} ${y1}"/>` : '') +
    `<circle cx="${cx}" cy="${cy}" r="5" fill="var(--bar)"/><circle cx="${gx}" cy="${gy}" r="5" fill="var(--sun)"/>` +
    `<text class="lbl" x="50" y="9">0시</text><text class="lbl" x="50" y="97">12시</text>`;
}
// 18시 → 다음 날 18시 막대 위에 자는 구간
function bar(bed, wake) {
  const L = wrap(bed - 1080), W = wrap(wake - bed), seg = (a, w) => `<span class="seg" style="left:${a / 14.4}%;width:${w / 14.4}%"></span>`;
  return L + W <= 1440 ? seg(L, W) : seg(L, 1440 - L) + seg(0, L + W - 1440);
}
const delta = m => m ? `${m > 0 ? '+' : '−'}${Math.abs(m)}분` : '';
// 고른 방향 카드는 아래 기간 슬라이더 값을, 다른 카드는 그 방향의 권장 기간을 보여줌
function renderOption(p, dir, key, isRec) {
  const sel = dir === p.dir && Number.isInteger(p.days) && p.days >= 1;
  const n = sel ? p.days : recDays(p, dir), rows = buildSchedule({ ...p, dir, days: n }), mv = moves(p, dir);
  $(key + 'Badge').classList.toggle('hidden', !isRec);
  drawRing($(key + 'Ring'), p, dir);
  $(key + 'Stats').innerHTML = `<div><b>${n}일</b><span>걸리는 날</span></div><div><b>${daySleeps(rows)}일</b><span>낮에 자는 날</span></div><div><b>${hShort(mv.bed)}</b><span>옮길 거리</span></div>`;
  const line = (lb, bed, wake, prevBed, goal) => `<li class="${goal ? 'goal' : ''}"><span class="lb">${lb}</span><span class="trk">${bar(bed, wake)}</span><span class="tm">${fmt(bed)}→${fmt(wake)}${goal ? ' 목표' : prevBed === null ? '' : `<span class="dl${Math.abs(shortestDiff(prevBed, bed)) > PACE[dir] ? ' fast' : ''}">${delta(shortestDiff(prevBed, bed))}</span>`}</span></li>`;
  let html = line('지금', toMin(p.curBed), toMin(p.curWake), null, false), prev = toMin(p.curBed);
  const show = rows.length <= 4 ? rows : rows.slice(0, 3);
  show.forEach((r, i) => { const last = r === rows.at(-1); html += line(i === 0 ? '첫날' : `${i + 1}일째`, r.bed, r.wake, prev, last); prev = r.bed; });
  if (rows.length > 4) { const r = rows.at(-1); html += `<li class="gap">· · ·</li>` + line(`${rows.length}일째`, r.bed, r.wake, null, true); }
  $(key + 'Prev').innerHTML = html;
}

function updateFinish() {
  const p = curForm();
  const same = toMin(p.curBed) === toMin(p.goalBed) && toMin(p.curWake) === toMin(p.goalWake);
  $('dirs').classList.toggle('hidden', same);
  const rec = same ? 'advance' : recommend(p);
  if (!same) {
    renderOption(p, 'advance', 'adv', rec === 'advance');
    renderOption(p, 'delay', 'del', rec === 'delay');
    const a = moves(p, 'advance').bed, d = moves(p, 'delay').bed;
    const other = rec === 'advance' ? 'delay' : 'advance', on = recDays(p, other), ods = daySleeps(buildSchedule({ ...p, dir: other, days: on }));
    $('why').innerHTML = rec === 'advance'
      ? `목표보다 <b>${hm(a)}</b> 늦게 자고 있어 거리가 가깝습니다. 생활을 유지하면서 <b>앞으로 당기기</b> 쪽이 맞아요. 뒤로 돌리면 ${on}일 중 ${ods}일을 낮에 자야 합니다.`
      : `목표보다 <b>${hm(d)}</b> 일찍 자고 있어 뒤로 미루는 거리가 가깝습니다. <b>뒤로 미루기</b> 쪽이 맞아요. 앞으로 당기면 ${on}일${ods ? `이 걸리고 그중 ${ods}일은 낮에 자야 합니다` : '이 걸립니다'}.`;
  }
  const d = p.days, mv = moves(p, p.dir);
  if (!Number.isInteger(d) || d < 1) { $('finish').textContent = ''; return; }
  const per = Math.max(Math.abs(mv.bed), Math.abs(mv.wake)) / d, fast = per > PACE[p.dir];
  $('pDays').textContent = `${d}일`;
  $('pPer').textContent = `${Math.round(per)}분`;
  $('pRate').textContent = same ? '-' : fast ? '빠름' : '권장';
  $('pRate').className = same ? '' : fast ? 'fast' : 'ok';
  $('pRateL').textContent = `${p.dir === 'delay' ? '미루기' : '당기기'} 권장 하루 ${PACE[p.dir]}분`;
  $('finish').innerHTML = same ? '' : `완료일 <b>${fmtDay(finishDay(p))}</b> · 하루에 취침 ${Math.round(Math.abs(mv.bed) / d)}분, 기상 ${Math.round(Math.abs(mv.wake) / d)}분씩 ${p.dir === 'delay' ? '미룸' : '앞당김'}`;
}
// 방향 카드를 고르면 그 방향의 권장 기간으로 슬라이더를 맞춤
function pickDir() {
  const p = curForm(), n = recDays(p, p.dir);
  $('days').max = Math.max(60, n); $('days').value = n;
  updateFinish();
}
['dirAdvance', 'dirDelay'].forEach(id => $(id).addEventListener('change', pickDir));
['days', 'startDate'].forEach(id => $(id).addEventListener('input', updateFinish));

$('planForm').onsubmit = e => {
  e.preventDefault();
  const plan = readForm();
  if (!plan) { const bad = document.querySelector('input.bad'); if (bad) bad.focus(); return; }
  localStorage.setItem(PLAN_KEY, JSON.stringify(plan));
  showScreen('today');
};

$('editPlan').onclick = () => {
  fillForm(loadPlan() || DEFAULTS);
  $('cancelEdit').classList.remove('hidden');
  showScreen('setup');
};
$('cancelEdit').onclick = () => showScreen('today');

// 시작: 플랜이 없으면 설정 화면부터
if (loadPlan()) showScreen('today');
else { fillForm(DEFAULTS); showScreen('setup'); }
</script>
</body>
</html>
